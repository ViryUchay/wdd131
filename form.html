<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Required meta tags -->
  <meta name="description" content="Submit ratings and feedback using this product review form with star ratings, features checklist, and written comments.">
  <meta name="author" content="Vivian Eze">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/form.css">
  <script defer src="scripts/form.js"></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>
  
  <main class="container">

    <form method="get" action="review.html" id="reviewForm">

      <!-- Product Name -->
<label for="product-list">Choose a Product:</label>
<select id="product-list" name="product" required>
  <option value="">Select a Product ...</option>
  
  </select>


      <!-- Rating -->
      <fieldset>
        <legend>Overall Rating</legend>
        <div class="stars">
          <!-- ALL 5 RADIOS  -->
          <div class="star-option">
            <input type="radio" id="r1" name="rating" value="1" required>
            <label for="r1">★</label>
          </div>
          <div class="star-option">
            <input type="radio" id="r2" name="rating" value="2" required>
            <label for="r2">★★</label>
          </div>
          <div class="star-option">
            <input type="radio" id="r3" name="rating" value="3" required>
            <label for="r3">★★★</label>
          </div>
          <div class="star-option">
            <input type="radio" id="r4" name="rating" value="4" required>
            <label for="r4">★★★★</label>
          </div>
          <div class="star-option">
            <input type="radio" id="r5" name="rating" value="5" required>
            <label for="r5">★★★★★</label>
          </div>
        </div>
      </fieldset>

      <!-- Date -->
      <label for="date">Date of Installation</label>
      <input type="date" id="date" name="date" required>

      <!-- Features -->
      <fieldset>
        <legend>Which features did you find useful?</legend>
        
        <input type="checkbox" id="durability" name="features" value="Durability"> 
        <label for="durability">Durability</label>

        <input type="checkbox" id="ease" name="features" value="Ease of Use"> 
        <label for="ease">Ease of Use</label>

        <input type="checkbox" id="performance" name="features" value="Performance"> 
        <label for="performance">Performance</label>

        <input type="checkbox" id="design" name="features" value="Design"> 
        <label for="design">Design</label>
      </fieldset>

      <!-- Review -->
      <label for="review">Written Review</label>
      <textarea id="review" name="review"></textarea>

      <!-- Name -->
      <label for="username">Your Name</label>
      <input type="text" id="username" name="username">

      <input type="submit" value="Post Review" class="btn">
    </form>
  </main>

  <footer>
    <p>©2026 Vivian Eze | Lagos, Nigeria<br>
    Last Modified: <span id="lastMod"></span></p>
  </footer>
</body>
